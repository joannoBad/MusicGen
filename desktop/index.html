<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicGen Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-topline">
          <div class="hero-brand">
            <div class="musicgen-logo" aria-hidden="true">
              <div class="musicgen-logo-ring" id="logo-ring"></div>
              <div class="musicgen-logo-core"></div>
            </div>
            <div class="hero-copy">
              <h1>MusicGen</h1>
              <p class="eyebrow" id="hero-eyebrow"></p>
            </div>
          </div>

          <div class="language-switcher" role="group" aria-label="Language switcher">
            <button class="language-pill language-pill-active" data-language="ru" type="button">RU</button>
            <button class="language-pill" data-language="en" type="button">ENG</button>
          </div>
        </div>

        <p class="lede" id="hero-lede"></p>
      </section>

      <section class="panel-grid">
        <form class="card upload-card" id="generator-form">
          <div class="card-header">
            <p class="section-kicker" id="input-kicker"></p>
            <h2 id="upload-title"></h2>
          </div>

          <div class="status-strip" aria-hidden="true">
            <span class="status-dot"></span>
            <span id="signal-status"></span>
            <span class="status-divider"></span>
            <span id="mode-status"></span>
          </div>

          <div class="mode-section">
            <div class="subsection-heading">
              <p class="section-kicker" id="mode-kicker"></p>
            </div>

            <div class="mode-segmented" role="radiogroup" aria-label="Fingerprint mode">
              <button class="mode-segment mode-segment-active" data-mode="exact" type="button">
                <div class="mode-segment-topline">
                  <strong id="mode-exact-label"></strong>
                  <span class="mode-chip">EXACT</span>
                </div>
                <span class="mode-tooltip" role="tooltip">
                  <span class="tooltip-shell">
                    <span class="tooltip-hologram" aria-hidden="true">
                      <span class="tooltip-hologram-aura"></span>
                      <svg class="tooltip-hologram-figure" viewBox="0 0 96 120">
                        <defs>
                          <linearGradient id="desktopHoloGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffd8fb"></stop>
                            <stop offset="55%" stop-color="#ff84ec"></stop>
                            <stop offset="100%" stop-color="#ff4fd8"></stop>
                          </linearGradient>
                        </defs>
                        <g fill="none" stroke="url(#desktopHoloGlow)" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M27 42c4-15 14-24 21-24 8 0 18 9 22 24" stroke-width="4.2"></path>
                          <path d="M31 43c-5 4-9 11-9 18 0 9 6 18 16 22" stroke-width="3.4"></path>
                          <path d="M66 43c5 4 9 11 9 18 0 9-6 18-16 22" stroke-width="3.4"></path>
                          <circle cx="48" cy="40" r="15" stroke-width="3.6"></circle>
                          <path d="M40 38c2-2 5-3 8-3 3 0 6 1 8 3" stroke-width="2.6"></path>
                          <path d="M44 46c2 2 6 2 8 0" stroke-width="2.2"></path>
                          <path d="M37 61c-10 5-18 18-18 31" stroke-width="3.5"></path>
                          <path d="M59 61c10 5 18 18 18 31" stroke-width="3.5"></path>
                          <path d="M48 62v21" stroke-width="3.5"></path>
                          <path d="M29 91c7-5 13-8 19-8s12 3 19 8" stroke-width="3.2"></path>
                          <path d="M33 26l-10-8" stroke-width="2.6"></path>
                          <path d="M63 26l10-8" stroke-width="2.6"></path>
                          <path d="M22 98h52" stroke-width="2.4" opacity="0.82"></path>
                          <path d="M30 104h36" stroke-width="2.1" opacity="0.64"></path>
                        </g>
                      </svg>
                    </span>
                    <span class="tooltip-copy" id="mode-exact-description"></span>
                  </span>
                </span>
              </button>

              <button class="mode-segment" data-mode="robust" type="button">
                <div class="mode-segment-topline">
                  <strong id="mode-robust-label"></strong>
                  <span class="mode-chip">ROBUST</span>
                </div>
                <span class="mode-tooltip" role="tooltip">
                  <span class="tooltip-shell">
                    <span class="tooltip-hologram" aria-hidden="true">
                      <span class="tooltip-hologram-aura"></span>
                      <svg class="tooltip-hologram-figure" viewBox="0 0 96 120">
                        <g fill="none" stroke="url(#desktopHoloGlow)" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M27 42c4-15 14-24 21-24 8 0 18 9 22 24" stroke-width="4.2"></path>
                          <path d="M31 43c-5 4-9 11-9 18 0 9 6 18 16 22" stroke-width="3.4"></path>
                          <path d="M66 43c5 4 9 11 9 18 0 9-6 18-16 22" stroke-width="3.4"></path>
                          <circle cx="48" cy="40" r="15" stroke-width="3.6"></circle>
                          <path d="M40 38c2-2 5-3 8-3 3 0 6 1 8 3" stroke-width="2.6"></path>
                          <path d="M44 46c2 2 6 2 8 0" stroke-width="2.2"></path>
                          <path d="M37 61c-10 5-18 18-18 31" stroke-width="3.5"></path>
                          <path d="M59 61c10 5 18 18 18 31" stroke-width="3.5"></path>
                          <path d="M48 62v21" stroke-width="3.5"></path>
                          <path d="M29 91c7-5 13-8 19-8s12 3 19 8" stroke-width="3.2"></path>
                          <path d="M33 26l-10-8" stroke-width="2.6"></path>
                          <path d="M63 26l10-8" stroke-width="2.6"></path>
                          <path d="M22 98h52" stroke-width="2.4" opacity="0.82"></path>
                          <path d="M30 104h36" stroke-width="2.1" opacity="0.64"></path>
                        </g>
                      </svg>
                    </span>
                    <span class="tooltip-copy" id="mode-robust-description"></span>
                  </span>
                </span>
              </button>
            </div>
          </div>

          <label class="file-dropzone">
            <span id="dropzone-title"></span>
            <small id="dropzone-hint"></small>
            <span class="file-picker-row">
              <span class="file-picker-button" id="select-audio-label"></span>
              <span class="file-picker-name" id="file-name"></span>
            </span>
            <input id="audio-input" accept=".wav,.mp3,audio/wav,audio/mpeg" type="file" />
          </label>

          <p class="trim-badge hidden" id="trim-badge"></p>

          <div class="audio-preview hidden" id="audio-preview-block">
            <p class="label" id="preview-audio-label"></p>
            <audio controls class="audio-player" id="audio-preview"></audio>
          </div>

          <button class="submit-button" id="generate-button" disabled type="submit"></button>

          <div class="progress-panel hidden" id="progress-panel" aria-live="polite">
            <div class="progress-copy">
              <p class="label" id="progress-title"></p>
              <p id="progress-label"></p>
            </div>
            <div class="progress-track">
              <span class="progress-fill" id="progress-fill" style="width: 0%"></span>
            </div>
          </div>

          <p class="microcopy" id="desktop-note"></p>
        </form>

        <aside class="card result-card">
          <div class="card-header">
            <p class="section-kicker" id="output-kicker"></p>
            <h2 id="result-title"></h2>
          </div>

          <div class="empty-shell" id="empty-state">
            <div class="empty-orb" aria-hidden="true"></div>
            <p class="empty-state" id="empty-state-text"></p>
          </div>

          <div class="result-stack hidden" id="result-stack">
            <div class="result-highlight">
              <p class="label" id="password-label"></p>
              <div class="password-row">
                <code class="password-block" id="password-block">******************</code>
                <button class="icon-button" id="toggle-password" type="button">
                  <svg aria-hidden="true" class="action-icon" viewBox="0 0 24 24">
                    <path id="eye-path" d="M3 4.5 20 19.5M6.1 7.2C7.8 5.9 9.8 5.2 12 5.2c6.7 0 10.5 6.8 10.5 6.8-.8 1.4-1.8 2.6-2.9 3.7M9 9.3a4 4 0 0 1 5.5 5.5M1.5 12c.8-1.3 1.8-2.5 3-3.6m2.2 8.2A11 11 0 0 0 12 18.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                    <circle id="eye-circle" class="hidden" cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                  </svg>
                </button>
                <button class="icon-button" id="copy-password" type="button">
                  <svg aria-hidden="true" class="action-icon" viewBox="0 0 24 24">
                    <path d="M8 7.5A2.5 2.5 0 0 1 10.5 5h6A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 8 16.5v-9ZM5 9.5V6.8A2.8 2.8 0 0 1 7.8 4H14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="result-meta">
              <div class="meta-tile meta-tile-pill">
                <div class="meta-tile-heading">
                  <p class="label" id="mode-result-label"></p>
                  <span class="meta-info-wrap meta-info-wrap-left" tabindex="0">
                    <svg aria-hidden="true" class="meta-info-icon" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                      <path d="M12 10.2v5.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
                      <circle cx="12" cy="7.3" r="1" fill="currentColor"></circle>
                    </svg>
                    <span class="meta-tooltip" role="tooltip" id="mode-tooltip-result">
                      <span class="tooltip-shell">
                        <span class="tooltip-hologram" aria-hidden="true">
                          <span class="tooltip-hologram-aura"></span>
                          <svg class="tooltip-hologram-figure" viewBox="0 0 96 120">
                            <g fill="none" stroke="url(#desktopHoloGlow)" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M27 42c4-15 14-24 21-24 8 0 18 9 22 24" stroke-width="4.2"></path>
                              <path d="M31 43c-5 4-9 11-9 18 0 9 6 18 16 22" stroke-width="3.4"></path>
                              <path d="M66 43c5 4 9 11 9 18 0 9-6 18-16 22" stroke-width="3.4"></path>
                              <circle cx="48" cy="40" r="15" stroke-width="3.6"></circle>
                              <path d="M40 38c2-2 5-3 8-3 3 0 6 1 8 3" stroke-width="2.6"></path>
                              <path d="M44 46c2 2 6 2 8 0" stroke-width="2.2"></path>
                              <path d="M37 61c-10 5-18 18-18 31" stroke-width="3.5"></path>
                              <path d="M59 61c10 5 18 18 18 31" stroke-width="3.5"></path>
                              <path d="M48 62v21" stroke-width="3.5"></path>
                              <path d="M29 91c7-5 13-8 19-8s12 3 19 8" stroke-width="3.2"></path>
                              <path d="M33 26l-10-8" stroke-width="2.6"></path>
                              <path d="M63 26l10-8" stroke-width="2.6"></path>
                              <path d="M22 98h52" stroke-width="2.4" opacity="0.82"></path>
                              <path d="M30 104h36" stroke-width="2.1" opacity="0.64"></path>
                            </g>
                          </svg>
                        </span>
                        <span class="tooltip-copy"></span>
                      </span>
                    </span>
                  </span>
                </div>
                <div class="result-pill result-pill-mode">
                  <strong id="result-mode-label"></strong>
                  <span class="result-pill-tag" id="result-mode-tag"></span>
                </div>
              </div>

              <div class="meta-tile meta-tile-pill">
                <div class="meta-tile-heading">
                  <p class="label" id="algorithm-result-label"></p>
                  <span class="meta-info-wrap meta-info-wrap-right" tabindex="0">
                    <svg aria-hidden="true" class="meta-info-icon" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                      <path d="M12 10.2v5.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
                      <circle cx="12" cy="7.3" r="1" fill="currentColor"></circle>
                    </svg>
                    <span class="meta-tooltip" role="tooltip" id="algorithm-tooltip-result">
                      <span class="tooltip-shell">
                        <span class="tooltip-hologram" aria-hidden="true">
                          <span class="tooltip-hologram-aura"></span>
                          <svg class="tooltip-hologram-figure" viewBox="0 0 96 120">
                            <g fill="none" stroke="url(#desktopHoloGlow)" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M27 42c4-15 14-24 21-24 8 0 18 9 22 24" stroke-width="4.2"></path>
                              <path d="M31 43c-5 4-9 11-9 18 0 9 6 18 16 22" stroke-width="3.4"></path>
                              <path d="M66 43c5 4 9 11 9 18 0 9-6 18-16 22" stroke-width="3.4"></path>
                              <circle cx="48" cy="40" r="15" stroke-width="3.6"></circle>
                              <path d="M40 38c2-2 5-3 8-3 3 0 6 1 8 3" stroke-width="2.6"></path>
                              <path d="M44 46c2 2 6 2 8 0" stroke-width="2.2"></path>
                              <path d="M37 61c-10 5-18 18-18 31" stroke-width="3.5"></path>
                              <path d="M59 61c10 5 18 18 18 31" stroke-width="3.5"></path>
                              <path d="M48 62v21" stroke-width="3.5"></path>
                              <path d="M29 91c7-5 13-8 19-8s12 3 19 8" stroke-width="3.2"></path>
                              <path d="M33 26l-10-8" stroke-width="2.6"></path>
                              <path d="M63 26l10-8" stroke-width="2.6"></path>
                              <path d="M22 98h52" stroke-width="2.4" opacity="0.82"></path>
                              <path d="M30 104h36" stroke-width="2.1" opacity="0.64"></path>
                            </g>
                          </svg>
                        </span>
                        <span class="tooltip-copy"></span>
                      </span>
                    </span>
                  </span>
                </div>
                <div class="result-pill result-pill-algorithm">
                  <strong id="result-algorithm-label"></strong>
                  <span class="result-pill-tag" id="result-algorithm-tag"></span>
                </div>
              </div>
            </div>

            <div class="fingerprint-animation" aria-hidden="true">
              <div class="music-visualizer" id="music-visualizer"></div>
            </div>
          </div>

          <p class="error-message hidden" id="error-message"></p>
        </aside>
      </section>

      <div class="limit-modal-backdrop hidden" id="limit-modal-backdrop" role="presentation">
        <div class="limit-modal" role="dialog" aria-modal="true" aria-labelledby="limit-modal-title">
          <p class="section-kicker" id="limit-kicker"></p>
          <h3 id="limit-modal-title"></h3>
          <p class="limit-modal-text" id="limit-message"></p>
          <p class="limit-modal-details" id="limit-modal-limit"></p>
          <p class="limit-modal-details" id="limit-modal-file"></p>
          <div class="limit-modal-actions">
            <button class="submit-button" id="trim-action-button" type="button"></button>
            <button class="secondary-button" id="replace-action-button" type="button"></button>
          </div>
        </div>
      </div>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
